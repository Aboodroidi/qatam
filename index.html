<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حسابات المزرعة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- شريط تنبيه إذا لم يتم ضبط الإعدادات -->
  <div id="setup-banner" class="banner hidden">
    ⚠️ لم يتم ضبط الاتصال بعد. افتح ملف <code>config.js</code> وأدخل بيانات Supabase.
  </div>

  <!-- شاشة اختيار الشريك -->
  <div id="who-screen" class="who-screen hidden">
    <div class="who-card">
      <div class="who-logo">🌾</div>
      <h1 id="who-farm-name">مزرعة قطم</h1>
      <p class="who-sub">من أنت؟</p>
      <div id="who-buttons" class="who-buttons"></div>
    </div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-logo">🌾</span>
          <div>
            <h1 id="farm-name">مزرعة قطم</h1>
            <span class="brand-sub">سجل حسابات المزرعة</span>
          </div>
        </div>
        <button id="who-pill" class="who-pill" title="تغيير المستخدم"></button>
      </div>
    </header>

    <main class="container">
      <!-- بطاقات الإجمالي -->
      <section class="totals" id="totals"></section>

      <!-- زر إضافة -->
      <button id="add-btn" class="add-btn">＋ إضافة إيصال</button>

      <!-- الفلاتر -->
      <section class="filters">
        <div class="filter-group" id="filter-partner"></div>
        <div class="filter-group" id="filter-category"></div>
      </section>

      <!-- قائمة الإيصالات -->
      <section id="receipts-list" class="receipts-list"></section>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-emoji">🧾</div>
        <p>لا توجد إيصالات بعد. اضغط «إضافة إيصال» للبدء.</p>
      </div>
      <div id="loading-state" class="loading-state">جارٍ التحميل…</div>
    </main>
  </div>

  <!-- نافذة إضافة إيصال -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2>إيصال جديد</h2>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <form id="receipt-form" class="form">
        <label class="field">
          <span>الشريك</span>
          <select id="f-partner" required></select>
        </label>

        <div class="row">
          <label class="field">
            <span>المبلغ</span>
            <input id="f-amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required />
          </label>
          <label class="field">
            <span>التاريخ</span>
            <input id="f-date" type="date" required />
          </label>
        </div>

        <label class="field">
          <span>الفئة</span>
          <select id="f-category" required></select>
        </label>

        <label class="field">
          <span>ملاحظة (اختياري)</span>
          <input id="f-note" type="text" placeholder="مثال: علف أبقار" />
        </label>

        <label class="field">
          <span>صورة الإيصال</span>
          <input id="f-photo" type="file" accept="image/*" capture="environment" />
          <div id="analyze-status" class="analyze-status hidden"></div>
          <div id="photo-preview" class="photo-preview hidden">
            <img id="photo-preview-img" alt="معاينة" />
          </div>
        </label>

        <div id="form-error" class="form-error hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" data-close>إلغاء</button>
          <button type="submit" id="submit-btn" class="btn-primary">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- عارض الصورة -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop" data-lb-close></div>
    <img id="lightbox-img" alt="صورة الإيصال" />
    <button class="lightbox-close" data-lb-close>✕</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
